[package]
name = "macdash-tui"
description = "Terminal dashboard rendering macdash metrics on a Raspberry Pi"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "macdash-tui"
path = "src/main.rs"

[dependencies]
macdash-proto = { path = "../proto" }
serde.workspace = true
serde_json.workspace = true
ratatui = "0.29"
crossterm = "0.28"
libc = "0.2"
socket2 = { version = "0.5", features = ["all"] }
fontdue = "0.9"
