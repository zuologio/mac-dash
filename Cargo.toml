[workspace]
members = ["crates/proto", "crates/agent", "crates/tui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/g10/macdash"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The Pi dashboard draws pixels on an ARMv6 core: speed beats size there
# (75 ms -> 52 ms a frame). The agent keeps the small build.
[profile.release.package.macdash-tui]
opt-level = 3
